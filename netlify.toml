[build]
  command = "npm run build"
  publish = "dist"

[build.environment]
  NODE_VERSION = "22"
  VITE_SHELBY_BASE_DOMAIN = "shelbyhost.xyz"

[functions]
  directory = "netlify/functions"
  node_bundler = "esbuild"

# API paths are handled by the Netlify function's explicit /api/* route.
# Project subdomains use the separate Shelby gateway; see infra/NETLIFY-SETUP.md.
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
